name: Update authorized TV playlist

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
      timezone: Europe/Madrid

permissions:
  contents: read

concurrency:
  group: playlist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python scripts/build_playlist.py
      - name: Install verified Kubo for native IPNS resolution
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kubo-download"
          gh release download v0.43.1 --repo ipfs/kubo \
            --pattern 'kubo_v0.43.1_linux-amd64.tar.gz' \
            --pattern 'kubo_v0.43.1_linux-amd64.tar.gz.sha512' \
            --dir "$RUNNER_TEMP/kubo-download"
          cd "$RUNNER_TEMP/kubo-download"
          sha512sum --check kubo_v0.43.1_linux-amd64.tar.gz.sha512
          tar -xzf kubo_v0.43.1_linux-amd64.tar.gz kubo/ipfs
          echo "$RUNNER_TEMP/kubo-download/kubo" >> "$GITHUB_PATH"
      - name: Refresh current catalogues and publish authorized sources
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python scripts/refresh_sources.py
      - name: Upload refresh report (metadata only)
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report
          path: .research/refresh-status.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
      - name: Validate
        run: python scripts/validate_playlist.py docs/canales.m3u
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
